# Showcase fork only (never part of an upstream pull request).
version: 1
app:
  install: "npm ci && npx nx run @blockly/field-slider:build && mkdir -p packages/plugins/field-slider/test/node_modules && ln -sfn ../../../../../node_modules/monaco-editor packages/plugins/field-slider/test/node_modules/monaco-editor"
  start: "cd packages/plugins/field-slider && WEBPACK_DEV_SERVER_BASE_PORT={port} npx blockly-scripts start --no-open"
  url: http://localhost:{port}
  readyPath: /
  runtime: node22
  env:
    NODE_ENV: development
demo:
  maxVideos: 1
  beforePass: true
